<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Season Timeline</title>
<style>
  :root{
    --bg-0:#0e1018;
    --bg-1:#141726;
    --bg-2:#1b1f33;
    --line:#262b42;
    --line-weak:#1e2236;
    --text-0:#eef0f8;
    --text-1:#a7acc4;
    --text-2:#6b7090;
    --accent:#ff7a59;
    --today:#ffe08a;
    --tv:#5b7cfa;
    --tv-d:#33407a;
    --movie:#2fbf9a;
    --movie-d:#1c6b58;
    --ova:#e0a83e;
    --ova-d:#7a5e1e;
    --ona:#c874e8;
    --ona-d:#5f3272;
    --special:#8f97b8;
    --special-d:#454a6b;
    --day-w:64px;
    --row-h:66px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg-0);color:var(--text-0);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;}
  #app{max-width:100%;}

  .header{padding:28px 28px 18px;}
  .header h1{margin:0 0 4px;font-size:26px;font-weight:600;letter-spacing:-0.02em;}
  .header p{margin:0;color:var(--text-1);font-size:13px;}

  .controls{display:flex;align-items:center;gap:14px;padding:0 28px 18px;flex-wrap:wrap;}
  .controls select,.controls button{
    background:var(--bg-2);border:1px solid var(--line);color:var(--text-0);
    padding:8px 12px;border-radius:8px;font-size:13px;cursor:pointer;
  }
  .controls button:hover, .controls select:hover{border-color:var(--accent);}
  .legend{display:flex;gap:16px;margin-left:auto;font-size:12px;color:var(--text-1);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block;}

  .status{padding:60px 28px;text-align:center;color:var(--text-1);font-size:14px;}

  .timeline-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:24px;position:relative;}
  .timeline-inner{position:relative;padding-left:220px;}

  .sidebar{position:absolute;left:0;top:0;width:220px;z-index:5;background:var(--bg-0);}
  .sidebar-row{
    height:var(--row-h);display:flex;align-items:center;gap:10px;
    padding:0 12px;border-bottom:1px solid var(--line-weak);
    border-right:1px solid var(--line);
  }
  .sidebar-row img{width:32px;height:44px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--bg-2);}
  .sidebar-row .name{font-size:12.5px;line-height:1.3;color:var(--text-0);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}

  .grid-header{height:52px;display:flex;position:relative;border-bottom:1px solid var(--line);}
  .day-cell{
    width:var(--day-w);flex-shrink:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;border-right:1px solid var(--line-weak);color:var(--text-1);font-size:11px;
  }
  .day-cell .dow{color:var(--text-2);font-size:10px;}
  .day-cell.today{color:var(--today);}
  .day-cell.weekend{background:rgba(255,255,255,0.015);}
  .month-label{position:absolute;top:-22px;font-size:11px;color:var(--accent);font-weight:600;}

  .rows{position:relative;}
  .grid-row{
    height:var(--row-h);position:relative;border-bottom:1px solid var(--line-weak);
    background-image:linear-gradient(to right, var(--line-weak) 1px, transparent 1px);
    background-size:var(--day-w) 100%;
  }

  .bar{
    position:absolute;top:9px;height:48px;border-radius:8px;overflow:hidden;
    display:flex;align-items:center;padding:0 10px;cursor:pointer;
    border:1px solid rgba(255,255,255,0.08);transition:transform .12s ease, filter .12s ease;
    background-size:cover;background-position:center;
  }
  .bar:hover{transform:translateY(-2px);filter:brightness(1.08);}
  .bar::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg, var(--tint,rgba(20,22,38,0.88)) 0%, var(--tint,rgba(20,22,38,0.55)) 65%, rgba(20,22,38,0.15) 100%);
  }
  .bar .bar-label{position:relative;z-index:1;font-size:12.5px;font-weight:600;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,0.6);}
  .bar .bar-dur{position:relative;z-index:1;margin-left:auto;font-size:10.5px;color:rgba(255,255,255,0.85);
    background:rgba(0,0,0,0.35);padding:2px 6px;border-radius:5px;flex-shrink:0;}

  .now-line{position:absolute;top:0;bottom:0;width:2px;background:var(--today);z-index:4;pointer-events:none;}
  .now-tag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:var(--today);
    color:#3a2c00;font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;}

  .tooltip{
    position:fixed;z-index:20;background:var(--bg-2);border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;font-size:12px;color:var(--text-0);max-width:260px;
    pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,0.4);display:none;
  }
  .tooltip .t-title{font-weight:600;margin-bottom:4px;font-size:13px;}
  .tooltip .t-meta{color:var(--text-1);}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>Season timeline</h1>
    <p>Airing windows for the current anime season, pulled live from AniList.</p>
  </div>
  <div class="controls">
    <select id="seasonSelect"></select>
    <select id="yearSelect"></select>
    <button id="refreshBtn">Refresh</button>
    <button id="todayBtn">Jump to today</button>
    <div class="legend">
      <span><span class="dot" style="background:var(--tv)"></span>TV</span>
      <span><span class="dot" style="background:var(--movie)"></span>Movie</span>
      <span><span class="dot" style="background:var(--ova)"></span>OVA/ONA</span>
      <span><span class="dot" style="background:var(--special)"></span>Special</span>
    </div>
  </div>
  <div id="statusBox" class="status">Loading season data from AniList…</div>
  <div id="timelineWrap" style="display:none;">
    <div class="timeline-scroll" id="scrollArea">
      <div class="timeline-inner" id="inner">
        <div class="sidebar" id="sidebar"></div>
        <div class="grid-header" id="gridHeader"></div>
        <div class="rows" id="rows"></div>
      </div>
    </div>
  </div>
</div>
<div class="tooltip" id="tooltip"></div>

<script>
const DAY_MS = 86400000;
const DAY_W = 64;
const ROW_H = 66;

function seasonFor(date){
  const m = date.getMonth();
  if(m>=2 && m<=4) return "SPRING";
  if(m>=5 && m<=7) return "SUMMER";
  if(m>=8 && m<=10) return "FALL";
  return "WINTER";
}

const now = new Date();
const seasonSelect = document.getElementById('seasonSelect');
const yearSelect = document.getElementById('yearSelect');
['WINTER','SPRING','SUMMER','FALL'].forEach(s=>{
  const o=document.createElement('option');o.value=s;o.textContent=s.charAt(0)+s.slice(1).toLowerCase();
  if(s===seasonFor(now))o.selected=true;
  seasonSelect.appendChild(o);
});
for(let y=now.getFullYear()-1;y<=now.getFullYear()+1;y++){
  const o=document.createElement('option');o.value=y;o.textContent=y;
  if(y===now.getFullYear())o.selected=true;
  yearSelect.appendChild(o);
}

const QUERY = `
query ($season: MediaSeason, $seasonYear: Int) {
  Page(page: 1, perPage: 50) {
    media(season: $season, seasonYear: $seasonYear, type: ANIME, sort: POPULARITY_DESC, isAdult: false) {
      id
      format
      status
      episodes
      title { romaji english }
      coverImage { medium color }
      startDate { year month day }
      endDate { year month day }
      nextAiringEpisode { airingAt episode }
    }
  }
}`;

function toDate(d){
  if(!d || !d.year) return null;
  return new Date(Date.UTC(d.year, (d.month||1)-1, d.day||1));
}

async function fetchSeason(season, year){
  const res = await fetch('https://graphql.anilist.co', {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body: JSON.stringify({query:QUERY, variables:{season, seasonYear:Number(year)}})
  });
  if(!res.ok) throw new Error('AniList request failed: '+res.status);
  const json = await res.json();
  if(json.errors) throw new Error(json.errors.map(e=>e.message).join(', '));
  return json.data.Page.media;
}

function colorFor(format){
  switch(format){
    case 'MOVIE': return {c:'var(--movie)', d:'var(--movie-d)'};
    case 'OVA': case 'ONA': return {c:'var(--ova)', d:'var(--ova-d)'};
    case 'SPECIAL': case 'MUSIC': return {c:'var(--special)', d:'var(--special-d)'};
    default: return {c:'var(--tv)', d:'var(--tv-d)'};
  }
}

function buildItems(media){
  const items = [];
  for(const m of media){
    let start = toDate(m.startDate);
    let end = toDate(m.endDate);
    if(!start && m.nextAiringEpisode){
      start = new Date(m.nextAiringEpisode.airingAt*1000 - (m.nextAiringEpisode.episode-1)*7*DAY_MS);
    }
    if(!start) continue;
    if(!end){
      const eps = m.episodes || (m.format==='MOVIE'?1:12);
      if(m.nextAiringEpisode){
        end = new Date(m.nextAiringEpisode.airingAt*1000 + (eps - m.nextAiringEpisode.episode)*7*DAY_MS + DAY_MS);
      } else {
        end = new Date(start.getTime() + Math.max(eps,1)*7*DAY_MS);
      }
    }
    if(end <= start) end = new Date(start.getTime() + DAY_MS);
    items.push({
      id:m.id,
      title: m.title.english || m.title.romaji,
      format: m.format,
      episodes: m.episodes,
      cover: m.coverImage && m.coverImage.medium,
      status: m.status,
      start, end
    });
  }
  items.sort((a,b)=>a.start-b.start);
  return items;
}

function render(items){
  const statusBox = document.getElementById('statusBox');
  const wrap = document.getElementById('timelineWrap');
  if(!items.length){
    statusBox.style.display='block';
    statusBox.textContent='No airing anime found for this season.';
    wrap.style.display='none';
    return;
  }
  statusBox.style.display='none';
  wrap.style.display='block';

  let minDate = new Date(Math.min(...items.map(i=>i.start.getTime())));
  let maxDate = new Date(Math.max(...items.map(i=>i.end.getTime())));
  minDate = new Date(minDate.getTime() - 3*DAY_MS);
  maxDate = new Date(maxDate.getTime() + 3*DAY_MS);
  const totalDays = Math.ceil((maxDate-minDate)/DAY_MS);

  const gridHeader = document.getElementById('gridHeader');
  const rows = document.getElementById('rows');
  const sidebar = document.getElementById('sidebar');
  gridHeader.innerHTML=''; rows.innerHTML=''; sidebar.innerHTML='';

  const today = new Date(); today.setUTCHours(0,0,0,0);
  const dowNames = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  let lastMonth = -1;
  for(let i=0;i<totalDays;i++){
    const d = new Date(minDate.getTime()+i*DAY_MS);
    const cell = document.createElement('div');
    cell.className='day-cell';
    const isToday = d.getTime()===today.getTime();
    const dow = d.getUTCDay();
    if(isToday) cell.classList.add('today');
    if(dow===0||dow===6) cell.classList.add('weekend');
    cell.innerHTML = `<span class="dow">${dowNames[dow]}</span><span>${d.getUTCDate()}</span>`;
    if(d.getUTCMonth()!==lastMonth){
      lastMonth=d.getUTCMonth();
      const label=document.createElement('div');
      label.className='month-label';
      label.style.left=(i*DAY_W)+'px';
      label.textContent=d.toLocaleString('en-US',{month:'long',timeZone:'UTC'});
      gridHeader.appendChild(label);
    }
    gridHeader.appendChild(cell);
  }
  gridHeader.style.width=(totalDays*DAY_W)+'px';
  rows.style.width=(totalDays*DAY_W)+'px';

  items.forEach((item,idx)=>{
    const sRow = document.createElement('div');
    sRow.className='sidebar-row';
    sRow.innerHTML = `${item.cover?`<img src="${item.cover}" alt="">`:'<div style="width:32px;height:44px;background:var(--bg-2);border-radius:4px"></div>'}<div class="name">${item.title}</div>`;
    sidebar.appendChild(sRow);

    const row = document.createElement('div');
    row.className='grid-row';

    const left = Math.floor((item.start-minDate)/DAY_MS)*DAY_W;
    const width = Math.max(Math.ceil((item.end-item.start)/DAY_MS)*DAY_W, DAY_W*0.6);
    const col = colorFor(item.format);
    const durDays = Math.round((item.end-item.start)/DAY_MS);

    const bar = document.createElement('div');
    bar.className='bar';
    bar.style.left=left+'px';
    bar.style.width=width+'px';
    bar.style.background = `linear-gradient(90deg, ${col.d}, ${col.c})`;
    if(item.cover){
      bar.style.backgroundImage = `linear-gradient(90deg, rgba(10,11,20,0.55), rgba(10,11,20,0.15)), url(${item.cover})`;
    }
    bar.innerHTML = `<span class="bar-label">${item.title}</span><span class="bar-dur">${durDays}d</span>`;
    bar.addEventListener('mouseenter', e=>showTip(e, item, durDays));
    bar.addEventListener('mousemove', e=>moveTip(e));
    bar.addEventListener('mouseleave', hideTip);
    row.appendChild(bar);
    rows.appendChild(row);
  });
  rows.style.height=(items.length*ROW_H)+'px';
  sidebar.style.height=(items.length*ROW_H + 52)+'px';

  const nowOffset = Math.floor((Date.now()-minDate.getTime())/DAY_MS)*DAY_W + DAY_W/2;
  if(nowOffset>=0 && nowOffset<=totalDays*DAY_W){
    const line = document.createElement('div');
    line.className='now-line';
    line.style.left=nowOffset+'px';
    line.style.height=(items.length*ROW_H)+'px';
    const tag=document.createElement('div');
    tag.className='now-tag';
    tag.textContent='Today';
    line.appendChild(tag);
    rows.appendChild(line);
  }

  document.getElementById('sidebar').style.top='52px';
  document.getElementById('inner').dataset.nowOffset = nowOffset;
}

function showTip(e, item, durDays){
  const tip = document.getElementById('tooltip');
  tip.style.display='block';
  const fmt = d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});
  tip.innerHTML = `<div class="t-title">${item.title}</div>
    <div class="t-meta">${item.format||'TV'} · ${item.episodes||'?'} eps</div>
    <div class="t-meta">${fmt(item.start)} → ${fmt(item.end)} (${durDays}d)</div>`;
  moveTip(e);
}
function moveTip(e){
  const tip = document.getElementById('tooltip');
  tip.style.left=(e.clientX+16)+'px';
  tip.style.top=(e.clientY+16)+'px';
}
function hideTip(){document.getElementById('tooltip').style.display='none';}

async function load(){
  const statusBox = document.getElementById('statusBox');
  const wrap = document.getElementById('timelineWrap');
  statusBox.style.display='block';
  statusBox.textContent='Loading season data from AniList…';
  wrap.style.display='none';
  try{
    const media = await fetchSeason(seasonSelect.value, yearSelect.value);
    const items = buildItems(media);
    render(items);
  }catch(err){
    statusBox.textContent = 'Could not reach AniList (' + err.message + '). This can happen if the artifact sandbox blocks the request — try opening this file outside claude.ai, or check your network settings.';
  }
}

document.getElementById('refreshBtn').addEventListener('click', load);
seasonSelect.addEventListener('change', load);
yearSelect.addEventListener('change', load);
document.getElementById('todayBtn').addEventListener('click', ()=>{
  const scrollArea = document.getElementById('scrollArea');
  const inner = document.getElementById('inner');
  const off = Number(inner.dataset.nowOffset||0);
  scrollArea.scrollLeft = Math.max(off-300,0);
});

load();
</script>
</body>
</html>
